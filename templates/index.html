<!DOCTYPE html>
<html>
<head>
    <title>Automated Sky Camera</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: #181825; padding: 20px; border-radius: 12px; flex: 1; min-width: 320px; }
        img.feed { width: 100%; max-width: 800px; border-radius: 8px; display: block; margin: auto;}
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 48%; margin-bottom: 10px; }
        .btn-full { width: 100%; margin-top: 10px; }
        .btn-green { background: #a6e3a1; color: #11111b; }
        .btn-red { background: #f38ba8; color: #11111b; }
        .btn-blue { background: #89b4fa; color: #11111b; }
        .btn-gray { background: #45475a; color: white; }
        
        .control-group { margin-bottom: 15px; background: #313244; padding: 10px; border-radius: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        select, input[type="number"], input[type="range"] { width: 100%; padding: 8px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 14px; }
        
        input[type="range"] { padding: 0; cursor: pointer; margin-bottom: 10px;}
        
        .gallery { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .gallery img, .gallery video { height: 120px; border-radius: 4px; border: 1px solid #45475a; background: black; }
        #status-bar { color: #a6e3a1; font-size: 14px; text-align: center; margin-top: 10px; min-height: 20px; }
        
        .gallery-tabs button { padding: 8px 15px; background: #313244; border: none; color: #cdd6f4; cursor: pointer; border-radius: 6px 6px 0 0; }
        .gallery-tabs button.active { background: #89b4fa; color: #11111b; font-weight: bold; }
        
        /* NEW: Telemetry Bar styling */
        .telemetry-bar { background: #11111b; padding: 10px; border-radius: 6px; display: flex; justify-content: space-around; margin-bottom: 15px; font-family: monospace; font-size: 14px; }
        .warn { color: #f38ba8 !important; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Live Feed & Manual Controls -->
        <div class="card" style="text-align: center; flex: 2;">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <h2>Live Feed</h2>
            </div>
            
            <!-- NEW: TELEMETRY BAR -->
            <div class="telemetry-bar">
                <span>🌡️ CPU Temp: <span id="tele_temp" style="color: #a6e3a1;">-- °C</span></span>
                <span>💾 SD Free Space: <span id="tele_disk" style="color: #89b4fa;">-- GB</span></span>
            </div>

            <img class="feed" src="/stream" />
            
            <div class="control-group" style="text-align: left; margin-top: 15px; background: #262738;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h4 style="margin: 0; color: #f9e2af;">🔍 Focus Assistant</h4>
                    <button class="btn btn-gray" onclick="toggleHistogram()" style="width: auto; margin: 0; padding: 5px 10px; font-size: 12px;">📊 Toggle Live Histogram</button>
                </div>
                
                <label>Digital Zoom: <span id="val_zoom" style="color: #a6e3a1;">1.0x</span></label>
                <input type="range" id="cam_zoom" min="1" max="10" step="0.5" value="1" oninput="updatePTZ()">
                
                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Pan X (Left/Right):</label>
                        <input type="range" id="cam_pan_x" min="0" max="1" step="0.05" value="0.5" oninput="updatePTZ()">
                    </div>
                    <div style="flex: 1;">
                        <label>Pan Y (Up/Down):</label>
                        <input type="range" id="cam_pan_y" min="0" max="1" step="0.05" value="0.5" oninput="updatePTZ()">
                    </div>
                </div>
            </div>

            <div id="status-bar"></div>
            
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="btn btn-blue" onclick="captureSinglePhoto()">📸 Capture Image</button>
                <button class="btn btn-red" id="btn-record" onclick="toggleRecording()">🎥 Start Video Record</button>
            </div>
            
            <hr style="border: 1px solid #313244; margin: 15px 0;">
            
            <h3 style="margin-bottom: 10px;">Timelapse Automation</h3>
            <div style="display: flex; justify-content: space-between;">
                <button class="btn btn-green" onclick="toggleTimelapse('start')">▶ Start Timelapse</button>
                <button class="btn btn-gray" onclick="toggleTimelapse('stop')">⏹ Stop Timelapse</button>
            </div>
        </div>

        <!-- Configuration Panel -->
        <div class="card">
            <h2>Settings & Scenarios</h2>
            
            <div class="control-group">
                <label>Preset Scenarios:</label>
                <select id="scenario_select" onchange="applyScenario()">
                    <option value="custom">-- Custom Settings --</option>
                    <option value="daytime">☀️ Daytime (Standard Setup)</option>
                    <option value="moon">🌕 The Moon (Very bright, fast shutter)</option>
                    <option value="planets">🪐 Planets (Fast frame rate, moderate gain)</option>
                    <option value="city_night">🌃 City Night (Light Polluted Stacking)</option>
                    <option value="milky_way">🌌 Milky Way / Deep Sky (Max exposure)</option>
                    <option value="meteors">☄️ Meteor Shower (Rapid Capture)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Exposure Mode:</label>
                <select id="auto_exposure">
                    <option value="3">Auto</option>
                    <option value="1">Manual</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div class="control-group" style="flex: 1;">
                    <label>Exposure Value:</label>
                    <input type="number" id="exposure" min="1" step="50">
                </div>
                <div class="control-group" style="flex: 1;">
                    <label>Camera Gain:</label>
                    <input type="number" id="gain" min="0" max="255" step="5">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="control-group" style="flex: 1;">
                    <label>Interval (Seconds):</label>
                    <input type="number" id="tl_interval" min="1" step="1">
                </div>
                <div class="control-group" style="flex: 1;">
                    <label>Batch Size:</label>
                    <input type="number" id="tl_batch" min="2" step="5">
                </div>
            </div>

            <button class="btn btn-full btn-blue" onclick="saveAllSettings()">Apply & Save Configurations</button>
        </div>

        <!-- Unified Gallery -->
        <div class="card" style="flex: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div class="gallery-tabs">
                    <button id="tab-processed" class="active" onclick="switchGalleryTab('processed')">Timelapse Stacks</button>
                    <button id="tab-manual" onclick="switchGalleryTab('manual')">Manual Captures</button>
                </div>
                <div>
                    <button class="btn btn-gray" onclick="generateVideo()" style="width: auto; padding: 6px 12px; margin: 0; margin-bottom: 5px;">🎬 Compile Timelapse Video</button>
                </div>
            </div>
            
            <div id="media-gallery" class="gallery"></div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let currentGalleryFolder = 'processed';

        // --- NEW: TELEMETRY POLLING LOGIC ---
        async function pollSystemHealth() {
            try {
                const res = await fetch('/api/system/health');
                const data = await res.json();
                
                const tempEl = document.getElementById('tele_temp');
                const diskEl = document.getElementById('tele_disk');
                
                tempEl.innerText = data.temp_c + " °C";
                diskEl.innerText = data.free_gb + " / " + data.total_gb + " GB";
                
                // Color warnings (Hotter than 70C or less than 2GB free)
                tempEl.className = data.temp_c > 70 ? 'warn' : '';
                diskEl.className = data.free_gb < 2.0 ? 'warn' : '';
                
            } catch (e) {
                console.error("Telemetry failed:", e);
            }
        }

        const scenarios = {
            "daytime": { auto_exposure: 3, exposure: 100, gain: 0, interval: 30, batch: 10 },
            "moon": { auto_exposure: 1, exposure: 20, gain: 0, interval: 5, batch: 5 },
            "planets": { auto_exposure: 1, exposure: 150, gain: 80, interval: 2, batch: 20 },
            "city_night": { auto_exposure: 1, exposure: 3000, gain: 100, interval: 1, batch: 40 },
            "milky_way": { auto_exposure: 1, exposure: 15000, gain: 200, interval: 2, batch: 15 },
            "meteors": { auto_exposure: 1, exposure: 1000, gain: 220, interval: 1, batch: 100 }
        };

        function applyScenario() {
            const s = document.getElementById("scenario_select").value;
            if (scenarios[s]) {
                document.getElementById("auto_exposure").value = scenarios[s].auto_exposure;
                document.getElementById("exposure").value = scenarios[s].exposure;
                document.getElementById("gain").value = scenarios[s].gain;
                document.getElementById("tl_interval").value = scenarios[s].interval;
                document.getElementById("tl_batch").value = scenarios[s].batch;
            }
        }

        function setStatus(msg) {
            document.getElementById('status-bar').innerText = msg;
            setTimeout(() => document.getElementById('status-bar').innerText = "", 4000);
        }

        async function toggleHistogram() {
            const res = await fetch('/api/control/histogram', { method: 'POST' });
            const data = await res.json();
            setStatus(data.showing ? "📊 Histogram ON" : "📊 Histogram OFF");
        }

        async function updatePTZ() {
            const z = parseFloat(document.getElementById('cam_zoom').value);
            const px = parseFloat(document.getElementById('cam_pan_x').value);
            const py = parseFloat(document.getElementById('cam_pan_y').value);
            
            document.getElementById('val_zoom').innerText = z.toFixed(1) + "x";
            
            await fetch('/api/control/ptz', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({zoom: z, pan_x: px, pan_y: py})
            });
        }

        async function captureSinglePhoto() {
            setStatus("Capturing manual photo...");
            const res = await fetch('/api/capture', { method: 'POST' });
            const data = await res.json();
            if (data.status === 'success') {
                setStatus("✅ Saved to manual folder: " + data.message);
                if (currentGalleryFolder === 'manual') loadGallery('manual');
            }
        }

        async function toggleRecording() {
            const btn = document.getElementById('btn-record');
            if (!isRecording) {
                const res = await fetch('/api/control/record', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'start'})
                });
                const data = await res.json();
                if (data.status === 'success') {
                    isRecording = true;
                    btn.innerText = "⏹ Stop Video Record";
                    btn.className = "btn btn-gray";
                    setStatus("🔴 Recording live video to manual folder...");
                }
            } else {
                await fetch('/api/control/record', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'stop'})
                });
                isRecording = false;
                btn.innerText = "🎥 Start Video Record";
                btn.className = "btn btn-red";
                setStatus("✅ Video recording saved.");
                if (currentGalleryFolder === 'manual') loadGallery('manual');
            }
        }

        async function saveAllSettings() {
            await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    auto_exposure: parseFloat(document.getElementById("auto_exposure").value),
                    exposure: parseFloat(document.getElementById("exposure").value),
                    gain: parseFloat(document.getElementById("gain").value)
                })
            });

            await fetch('/api/config/timelapse', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    interval: parseInt(document.getElementById("tl_interval").value),
                    batch_size: parseInt(document.getElementById("tl_batch").value)
                })
            });
            
            setStatus("✅ Configurations saved and applied.");
        }

        async function toggleTimelapse(action) {
            await fetch('/api/control/timelapse', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: action})
            });
            setStatus("Automation " + action + "ed!");
        }

        function switchGalleryTab(folder) {
            currentGalleryFolder = folder;
            document.getElementById('tab-processed').className = folder === 'processed' ? 'active' : '';
            document.getElementById('tab-manual').className = folder === 'manual' ? 'active' : '';
            loadGallery(folder);
        }

        async function generateVideo() {
            setStatus("Processing timelapse video...");
            const res = await fetch('/api/control/make_video', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({fps: 10})
            });
            const data = await res.json();
            if (data.status === 'success') {
                setStatus("✅ Timelapse compiled!");
                switchGalleryTab('processed'); 
            } else {
                setStatus("❌ Error: " + data.message);
            }
        }

        async function loadGallery(folder) {
            const res = await fetch('/api/gallery/' + folder);
            const data = await res.json();
            const container = document.getElementById('media-gallery');
            container.innerHTML = '';
            
            if (data.files.length === 0) {
                container.innerHTML = '<p style="padding: 10px; color: #6c7086;">No media found in this folder.</p>';
                return;
            }
            
            data.files.forEach(file => {
                if (file.endsWith('.mp4')) {
                    container.innerHTML += `
                        <div style="text-align: center;">
                            <video src="/image/${folder}/${file}" controls></video>
                            <br><a href="/image/${folder}/${file}" download="${file}" style="font-size: 11px; color: #a6e3a1;">Download</a>
                        </div>`;
                } else {
                    container.innerHTML += `
                        <div style="text-align: center;">
                            <a href="/image/${folder}/${file}" target="_blank">
                                <img src="/image/${folder}/${file}">
                            </a>
                            <br><a href="/image/${folder}/${file}" download="${file}" style="font-size: 11px; color: #a6e3a1;">Download</a>
                        </div>`;
                }
            });
        }
        
        window.onload = async () => {
            const resTL = await fetch('/api/config/timelapse');
            const tlConfig = await resTL.json();
            document.getElementById('tl_interval').value = tlConfig.interval;
            document.getElementById('tl_batch').value = tlConfig.batch_size;
            
            loadGallery('processed');
            
            // Start the telemetry polling loop
            pollSystemHealth();
            setInterval(pollSystemHealth, 5000); // Update every 5 seconds
        };
    </script>
</body>
</html>
